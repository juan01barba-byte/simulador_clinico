<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simulador de Casos Clínicos con Gemini</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-900 to-indigo-950 text-white p-6 rounded-2xl shadow-lg mb-6">
      <h1 class="text-2xl font-bold tracking-tight">Simulador Clínico & Tutor IA</h1>
      <p class="text-blue-200 text-sm mt-1">Entrenamiento diagnóstico sobre casos reales con Gemini API</p>
      
      <!-- Configuración API Key y Archivo -->
      <div class="mt-4 pt-4 border-t border-blue-800 grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
        <div>
          <label class="block text-blue-200 mb-1 font-semibold">1. Tu Google AI API Key:</label>
          <input type="password" id="apiKeyInput" placeholder="Pega tu clave AIzaSy..." 
                 class="w-full px-3 py-2 rounded-lg bg-blue-950 border border-blue-700 text-white focus:outline-none focus:ring-1 focus:ring-blue-400">
        </div>
        <div>
          <label class="block text-blue-200 mb-1 font-semibold">2. Cargar casos (.jsonl):</label>
          <input type="file" id="fileInput" accept=".jsonl" 
                 class="w-full px-3 py-1.5 rounded-lg bg-blue-950 border border-blue-700 text-white file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:bg-blue-600 file:text-white cursor-pointer">
        </div>
      </div>
      <p id="statusMsg" class="text-xs text-blue-300 mt-2">Introduce tu API Key y sube el archivo descargado para empezar.</p>
    </header>

    <!-- Área de Trabajo (Oculta al inicio) -->
    <div id="workspace" class="hidden space-y-6">
      
      <!-- Controles de Navegación -->
      <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-3">
        <input type="text" id="searchInput" placeholder="Filtrar por síntoma o enfermedad..." 
               class="px-3 py-2 border border-slate-300 rounded-lg text-sm w-full md:w-64 focus:outline-none focus:ring-2 focus:ring-blue-600">
        
        <div class="flex items-center gap-2">
          <button id="prevBtn" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-xs font-semibold rounded-lg">Anterior</button>
          <span id="counter" class="text-xs font-semibold text-slate-600">0 / 0</span>
          <button id="nextBtn" class="px-3 py-2 bg-slate-200 hover:bg-slate-300 text-xs font-semibold rounded-lg">Siguiente</button>
          <button id="randomBtn" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold rounded-lg">Caso Aleatorio</button>
        </div>
      </div>

      <!-- Presentación del Paciente -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-bold text-blue-900 uppercase tracking-wider" id="caseTitle">Caso Clínico</h2>
          <span id="blurredDx" class="filter blur-sm bg-slate-200 px-3 py-1 rounded text-xs font-bold cursor-pointer select-none" title="Clic para ver">Diagnóstico Oculto</span>
        </div>
        <div id="patientText" class="bg-slate-50 p-4 rounded-lg border border-slate-200 text-sm text-slate-700 whitespace-pre-wrap font-sans leading-relaxed">
          <!-- Datos del paciente -->
        </div>
      </div>

      <!-- Sección de Interacción con Gemini -->
      <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6 space-y-4">
        <h3 class="text-sm font-bold text-slate-900 uppercase tracking-wide">Tu Evaluación Clínica & Feedback con Gemini</h3>
        
        <textarea id="studentHypothesis" rows="3" placeholder="Escribe tu hipótesis diagnóstica, estudios solicitados o plan de manejo..." 
                  class="w-full p-3 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-600"></textarea>

        <div class="flex gap-3">
          <button id="evaluateBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-4 py-2.5 rounded-lg transition shadow">
            Evaluar mi respuesta con Gemini
          </button>
          <button id="toggleCaseBtn" class="bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-semibold px-4 py-2.5 rounded-lg transition">
            Ver consulta completa del dataset
          </button>
        </div>

        <div id="feedbackArea" class="hidden bg-blue-50 border border-blue-200 rounded-lg p-4 text-xs leading-relaxed text-slate-800 space-y-2">
          <!-- Respuesta de Gemini -->
        </div>

        <div id="fullMeetingArea" class="hidden bg-slate-50 border border-slate-200 rounded-lg p-4 text-xs font-mono whitespace-pre-wrap max-h-80 overflow-y-auto text-slate-700">
          <!-- Diálogo completo -->
        </div>
      </div>

    </div>
  </div>

  <script>
    let cases = [];
    let filteredCases = [];
    let currentIndex = 0;

    const apiKeyInput = document.getElementById('apiKeyInput');
    const fileInput = document.getElementById('fileInput');
    const statusMsg = document.getElementById('statusMsg');
    const workspace = document.getElementById('workspace');
    const counter = document.getElementById('counter');
    const caseTitle = document.getElementById('caseTitle');
    const blurredDx = document.getElementById('blurredDx');
    const patientText = document.getElementById('patientText');
    const studentHypothesis = document.getElementById('studentHypothesis');
    const evaluateBtn = document.getElementById('evaluateBtn');
    const feedbackArea = document.getElementById('feedbackArea');
    const fullMeetingArea = document.getElementById('fullMeetingArea');
    const toggleCaseBtn = document.getElementById('toggleCaseBtn');

    // Cargar clave guardada en el navegador si existe
    if (localStorage.getItem('gemini_key')) {
      apiKeyInput.value = localStorage.getItem('gemini_key');
    }

    apiKeyInput.addEventListener('change', () => {
      localStorage.setItem('gemini_key', apiKeyInput.value.trim());
    });

    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      statusMsg.textContent = "Procesando archivo .jsonl...";
      const reader = new FileReader();

      reader.onload = function(evt) {
        const lines = evt.target.result.split('\n');
        cases = [];
        for (let l of lines) {
          if (l.trim()) {
            try { cases.push(JSON.parse(l)); } catch(err){}
          }
        }
        filteredCases = [...cases];
        statusMsg.textContent = `¡Listo! Se cargaron ${cases.length} casos clínicos.`;
        workspace.classList.remove('hidden');
        currentIndex = 0;
        renderCase();
      };
      reader.readAsText(file);
    });

    function renderCase() {
      if (!filteredCases.length) return;
      const c = filteredCases[currentIndex];
      counter.textContent = `${currentIndex + 1} / ${filteredCases.length}`;
      caseTitle.textContent = `Caso Clínico #${currentIndex + 1}`;

      const raw = c.text || c.conversation || JSON.stringify(c);
      const lines = raw.split('\n');
      patientText.textContent = lines.slice(0, 14).join('\n');
      
      blurredDx.textContent = c.disease || c.title || "Diagnóstico";
      blurredDx.classList.add('blur-sm');

      feedbackArea.classList.add('hidden');
      feedbackArea.innerHTML = '';
      fullMeetingArea.classList.add('hidden');
      fullMeetingArea.textContent = raw;
      studentHypothesis.value = '';
    }

    blurredDx.addEventListener('click', () => blurredDx.classList.toggle('blur-sm'));

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentIndex < filteredCases.length - 1) { currentIndex++; renderCase(); }
    });
    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentIndex > 0) { currentIndex--; renderCase(); }
    });
    document.getElementById('randomBtn').addEventListener('click', () => {
      currentIndex = Math.floor(Math.random() * filteredCases.length);
      renderCase();
    });

    toggleCaseBtn.addEventListener('click', () => fullMeetingArea.classList.toggle('hidden'));

    // Llamada directa a la API de Gemini desde el navegador
    evaluateBtn.addEventListener('click', async () => {
      const key = apiKeyInput.value.trim();
      const answer = studentHypothesis.value.trim();

      if (!key) {
        alert("Por favor ingresa tu API Key de Gemini en la parte superior.");
        return;
      }
      if (!answer) {
        alert("Escribe primero tu impresión diagnóstica o plan clínico.");
        return;
      }

      evaluateBtn.disabled = true;
      evaluateBtn.textContent = "Consultando a Gemini...";
      feedbackArea.classList.remove('hidden');
      feedbackArea.innerHTML = "<em>Analizando tu respuesta con el caso de referencia...</em>";

      const currentCaseText = filteredCases[currentIndex].text || JSON.stringify(filteredCases[currentIndex]);

      const promptText = `Actúa como médico especialista docente evaluando a un interno de medicina.
Caso clínico de referencia:
"""
${currentCaseText}
"""

Respuesta del estudiante:
"""
${answer}
"""

Instrucciones:
1. Indica si el diagnóstico y manejo son correctos o acertados.
2. Señala aciertos y omisiones importantes según el caso.
3. Proporciona una recomendación breve de manejo basada en evidencia.`;

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`;
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: promptText }] }]
          })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error.message);

        const reply = data.candidates[0].content.parts[0].text;
        feedbackArea.innerHTML = `<h4 class="font-bold text-blue-900 mb-1">Feedback del Tutor:</h4><p class="whitespace-pre-wrap font-sans">${reply}</p>`;
      } catch (err) {
        feedbackArea.innerHTML = `<span class="text-red-600 font-semibold">Error al conectar con la API: ${err.message}</span>`;
      } finally {
        evaluateBtn.disabled = false;
        evaluateBtn.textContent = "Evaluar mi respuesta con Gemini";
      }
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase();
      filteredCases = cases.filter(c => (c.text || c.disease || "").toLowerCase().includes(q));
      currentIndex = 0;
      renderCase();
    });
  </script>
</body>
</html>
